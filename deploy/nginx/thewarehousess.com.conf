# thewarehousess.com — the brand domain, served by the same app as
# warehouses.buytogetherindia.com (127.0.0.1:5030). NOT ENABLED until switch day.
#
# Switch day (see the domain-move plan):
#   1. DNS: point thewarehousess.com and www A/AAAA records at this server.
#      Leave MX and TXT (email) alone.
#   2. cp deploy/nginx/thewarehousess.com.conf /etc/nginx/sites-available/
#      ln -s ../sites-available/thewarehousess.com.conf /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d thewarehousess.com -d www.thewarehousess.com
#      (certbot adds the 443 listener and the http->https redirect)
#
# Old WooCommerce links keep working: /product/<slug>/ and /product-category/…
# are answered by the app with a 301 to the same product or category.

server {
    listen 80;
    listen [::]:80;
    server_name www.thewarehousess.com;
    return 301 https://thewarehousess.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name thewarehousess.com;

    root /var/www/warehouses;
    index index.html;
    client_max_body_size 55m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Old WordPress / WooCommerce addresses ──────────────────────────────
    # A product id (24 hex characters) is this app's own page.
    location ~ "^/product/[0-9a-f]{24}/?$" {
        try_files /index.html =404;
    }
    # Anything else under /product/ is an old WooCommerce slug.
    location ~ "^/product/[^/]+/?$" {
        proxy_pass http://127.0.0.1:5030/api/v1/legacy$uri;
        proxy_set_header Host $host;
    }
    location ^~ /product-category/ {
        proxy_pass http://127.0.0.1:5030/api/v1/legacy$uri;
        proxy_set_header Host $host;
    }
    location = /shop { return 301 /; }
    location = /shop/ { return 301 /; }
    location ~ ^/my-account(/.*)?$ { return 301 /profile; }
    location ~ ^/checkout/?$ { return 301 /cart; }
    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php)(/|$) { return 301 /; }

    # ── This app (same as warehouses.buytogetherindia.com) ─────────────────
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        alias /var/www/warehouses-uploads/;
        expires 7d;
    }

    location = /api/deploy { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:5030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
