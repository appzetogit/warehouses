# nginx site for The Warehouses — one domain serves everything:
#
#   /                 the built customer site + admin + seller panels (Frontend/dist)
#   /api/             Node API cluster            (PM2 "warehouses-api",    127.0.0.1:5000)
#   /socket.io/       dedicated Socket.IO server  (PM2 "warehouses-socket", 127.0.0.1:5001)
#   /uploads/         uploaded images/videos, straight from disk (UPLOAD_STORAGE_ROOT).
#                     In production Node does NOT serve /uploads (Backend/src/app.js only
#                     mounts it when NODE_ENV=development), so nginx must.
#   /seller-detail/, /product-detail, /.well-known/assetlinks.json
#                     share-link landing pages rendered by the API (shareLinks.routes.js)
#
# Install:
#   sudo cp deploy/nginx/warehouses.conf /etc/nginx/sites-available/warehouses
#   sudo ln -s /etc/nginx/sites-available/warehouses /etc/nginx/sites-enabled/warehouses
#   # replace example.com and the paths below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: get a certificate first (e.g. `sudo certbot certonly --nginx -d example.com`);
# the paths below are certbot's defaults.
#
# Paths assumed (match deploy/README.md):
#   /srv/warehouses/current/Frontend/dist   the frontend build
#   /var/www/uploads                        UPLOAD_STORAGE_ROOT (Backend default in production)

upstream warehouses_api {
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream warehouses_socket {
    server 127.0.0.1:5001;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=wh_api:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=wh_perip:10m;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS (the ACME path stays on HTTP so certbot renewals work)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/warehouses/current/Frontend/dist;
    index index.html;

    server_tokens off;
    keepalive_timeout 65;

    # Must be >= the API's own upload cap (MAX_UPLOAD_BYTES, 50 MB by default in
    # Backend/src/middleware/upload.js) so the API, not nginx, rejects oversize
    # files with a JSON message the panel can show.
    client_max_body_size 52m;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- security headers (repeated in any location that sets its own add_header,
    #     because nginx drops inherited add_header lines in that case) ---------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # geolocation is used by the customer site (delivery address) and rider pages.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(self \"https://checkout.razorpay.com\")" always;
    # No Content-Security-Policy yet: the site loads Google Maps, Firebase and the
    # Razorpay checkout from third-party origins. Add one in Report-Only mode first.

    # --- health (no rate limit; for uptime monitors) ------------------------
    location = /health {
        proxy_pass http://warehouses_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # --- legacy deploy webhook (Backend/server.js runs ~/deploy.sh from it) --
    # Never reachable from the internet; deploy from CI over SSH instead.
    location = /api/deploy {
        return 404;
    }

    # --- API ---------------------------------------------------------------
    location ^~ /api/ {
        limit_req  zone=wh_api burst=60 nodelay;
        limit_conn wh_perip 30;

        proxy_pass http://warehouses_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;   # the API itself times requests out at 30s
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;

        # API responses are per-user; never let a shared cache keep them.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Socket.IO (websocket upgrade + long-polling fallback) --------------
    location ^~ /socket.io/ {
        proxy_pass http://warehouses_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # --- uploaded media: served from disk, never executed -------------------
    location ^~ /uploads/ {
        alias /var/www/uploads/;
        access_log off;
        autoindex off;

        location ~* \.(jpe?g|png|webp|gif|mp4|webm)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            # No try_files here: it misbehaves with `alias` in a nested regex
            # location; the static handler already returns 404 for a missing file.
        }

        # Anything else under /uploads/ (html, svg, js, ...) is refused.
        return 404;
    }

    # --- share-link landing pages rendered by the API -----------------------
    location = /.well-known/assetlinks.json {
        proxy_pass http://warehouses_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(seller-detail/|product-detail) {
        proxy_pass http://warehouses_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- frontend ----------------------------------------------------------
    # Vite emits content-hashed files under /assets/: cache them for a year.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fixed-name files that change between releases: always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never serve dotfiles (.env, .git, ...) if one ever lands in the web root.
    # Listed before the static-file regex so it wins.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Other public/ files (brand images, notification sound, robots.txt).
    location ~* \.(png|jpe?g|gif|webp|svg|ico|mp3|woff2?|txt|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

}
